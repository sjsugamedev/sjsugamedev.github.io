<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/minecraft.css" type="text/css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  
  <script src="javascript/footer.js" type="text/javascript" defer></script>
  <script src="javascript/header.js" type="text/javascript" defer></script>
  <title>Game Dev Club</title>
</head>

<body>
  <!--navbar & logo-->
  <header-component></header-component>

  <!--header image-->
  <div id="header_image">
    <!--header text-->
  </div>

  <!-- Main section -->
  <div class="main-section">

    <div class="title">
      <img class="corner" id="left_corner" src="assets/Group 5.png" alt="Left Corner">
      <div class="title-text">
        <span>Minecraft</span><br>
      </div>
      <img class="corner" id="right_corner" src="assets/Group 5.png" alt="Right Corner">
    </div>

    <div class="text">
      <div class="text2">
        <span>ip address <br>
          Join other club members in Minecraft<br> where
          you can build, craft, and mine. </span><br>
      </div>
    </div>

    <img class="game" id="mascot_right" src="assets/Group (2).png" alt="Left Mascot">
    <img class="whiteslame" id="mascot_left" src="assets/Vector.png" alt="Left Mascot">

    <div class="image1">
      <iframe width=1920 height="1027" src="assets/craft_23.png" class="image1.1" alt="Image 1"></iframe>
    </div>

    <div class="image2">
      <iframe width=1920 height="1027" src="assets/craft_33.png" class="image2.1" alt="Image 2"></iframe>
    </div>

    <!-- Logo Container -->
    <div class="logo-container">
      <!-- Left Logo -->
      <img src="assets/group3.png" alt="TOPLEFT" id="left_middle_logo4">

      <!-- Right Logo -->
      <img src="assets/Group.png" alt="TOPRIGHT" id="right_middle_logo4">

    </div>
    <div class="logo-container">

    <img src="assets/group3.png" alt="BOTTOMLEFT" id="left_down">
</div>
  </div>

  <footer-component></footer-component>

</body>

</html>

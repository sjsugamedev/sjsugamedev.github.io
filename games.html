<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/games.css" type="text/css">
  <link rel="stylesheet" href="css/header.css" type="text/css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <script src="javascript/footer.js" type="text/javascript" defer></script>
  <script src="javascript/header.js" type="text/javascript" defer></script>
  <script src="javascript/social-links.js" type="text/javascript" defer></script>
  <title>Games</title>
</head>

<body>
  <!--navbar & logo-->
  <header-component></header-component>

  <!--header image-->
  <div id="header_image">
    <div class="title">
      <strong>Games from <span style="color: #ffc436;">Game Dev!</span></strong>
      <div id="header_text_description">
        <br>Check out the games from previous semesters through our itch.io page.
      </div>
    </div>
    <social-links-component></social-links-component>
  </div>  

  <!--page title and decor-->
  <h1 class="featured-title">
    <img id="left_corner" src="assets/featuredgames_corners.svg">
    <img id="mascot_left" src="assets/mascot_left.svg">
    <span>Featured Games</span>
    <img id="right_corner" src="assets/featuredgames_corners.svg">
    <img id="mascot_right" src="assets/CatDownTransparent.png">
  </h1>

  <div class="games">
    <!-- To add a new game, copy the line below and paste in the game URL -->
    <div class="game-embed-placeholder" data-url="https://lectroblob.itch.io/seniordiscount"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3126162"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3145387"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3159282"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/2974118"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3130220"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3124323"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3159731"></div>
    <div class="game-embed-placeholder" data-url="https://itch.io/jam/2024-final-fall-semester-showcase-sjsu-game/rate/3155285"></div>
  </div>

  <!--padding for bottom-->
  <div style="margin-bottom: 30rem;"></div>

  <!--footer-->
  <footer-component></footer-component>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const placeholders = document.querySelectorAll('.game-embed-placeholder');
      for (const placeholder of placeholders) {
        await createEmbed(placeholder);
        await new Promise(resolve => setTimeout(resolve, 300)); // Add a delay between requests
      }
    });

    async function createEmbed(placeholder) {
      const url = placeholder.dataset.url;
      if (!url) {
        placeholder.innerHTML = '<p>No URL provided.</p>';
        return;
      }

      placeholder.innerHTML = '<p>Loading...</p>';

      try {
        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.status === 'success' && data.data.title) {
          const info = data.data;
          const imageUrl = info.image?.url || info.logo?.url || '';
          
          let gameTitle = info.title;
          let authorInfo = '';

          if (info.url.includes('itch.io')) {
            const bySplit = info.title.split(' by ');
            if (bySplit.length > 1) {
              gameTitle = bySplit[0];
              authorInfo = `by ${bySplit.slice(1).join(' by ')}`;
            }
          } else if (info.url.includes('steampowered.com')) {
            gameTitle = info.title.replace(/ on Steam$/, '');
          }

          const embedHTML = `
            <div class="game-embed-card">
              <a href="${info.url}" target="_blank" rel="noopener noreferrer">
                ${imageUrl ? `<img src="${imageUrl}" alt="${gameTitle}">` : ''}
                <div class="game-embed-info">
                  <h4>${gameTitle}</h4>
                  ${authorInfo ? `<p class="game-author-info">${authorInfo}</p>` : ''}
                  <p>${info.description || ''}</p>
                  <span>${info.publisher || new URL(info.url).hostname}</span>
                </div>
              </a>
            </div>
          `;
          placeholder.innerHTML = embedHTML;
        } else {
          console.log('Microlink API response:', data);
          placeholder.innerHTML = '<p>Could not fetch preview. Please check the URL.</p>';
        }
      } catch (error) {
        console.error('Error fetching game data:', error);
        placeholder.innerHTML = '<p>An error occurred while fetching the preview.</p>';
      }
    }
  </script>

</body>
</html>
